# revA
XBOOT_CONFIGS[defc] = "q628_defconfig"
# revB
XBOOT_CONFIGS[emmc] = "q628_Rev2_EMMC_defconfig"
XBOOT_CONFIGS[nand] = "q628_Rev2_SPINAND_defconfig"
