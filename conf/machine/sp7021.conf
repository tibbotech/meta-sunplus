#@TYPE: Machine
#@NAME: sp7021 A7 (primary) CPU
#@DESCRIPTION: Machine configuration for the sp7021 Plus1 series SoC https://tibbo.com/store/plus1.html

# CPU features and optimizations

DEFAULTTUNE ?= "cortexa9hf-neon"

require sp7021-arch.${LAYERSERIES_CORENAMES}.inc

# Bootloaders and kernels
require conf/machine/include/sp-prefs.inc
# Yocto branch: >= Nanbield has SSL 3.0, allowed with kernel 5.10
PREFERRED_VERSION_linux-sp ?= "5.4%"

# will be deprecated soon
SERIAL_CONSOLES ?= "115200;ttyS0"

SOC_B ??= "sp7021-arm5"

ISP_VAR_DTB ?= "sp7021-ltpp3g2revD.dtb"

# default a926 binary images
ISP_A926_BIN ?= "a926-empty.img"

# default X-Boot binaries for WKS, EMMC0 and NAND0 images
WKS_XBOOT ?= "xboot-emmc.img"
ISP_EMMC0_XBOOT ?= "xboot-emmc.img"
ISP_NAND0_XBOOT ?= "xboot-nand.img"

# default U-Boot binaries for WKS, EMMC0 and NAND0 images
WKS_UBOOT ?= "u-boot.bin-a7021_emmc.img"
ISP_EMMC0_UBOOT ?= "u-boot.bin-a7021_ppg2.img"
ISP_NAND0_UBOOT ?= "u-boot.bin-a7021_nand.img"

ISP_EMMC0_FIP ?= "sp7021-optee.itb"

# default DTB binarw for WKS
#WKS_DTB ?= "sp7021-ltpp3g2-empty.dtb"
WKS_DTB ?= "sp7021-ltpp3g2revD.dtb"

require conf/machine/include/sp-rrecommends.inc

require conf/machine/include/sp7021-isp.inc

EXTRA_IMAGEDEPENDS += "spmake-native"
EXTRA_IMAGEDEPENDS += "isp-native"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"
EXTRA_IMAGEDEPENDS += "${@bb.utils.contains("MACHINE_FEATURES", "optee", "fip-sp", "", d)}"

do_image[mcdepends] += "mc:${BB_CURRENT_MC}:${SOC_B}:bnoos:do_deploy"
do_image[mcdepends] += "mc:${BB_CURRENT_MC}:${SOC_B}:xboot:do_deploy"

PACKAGE_FEED_ARCHS = "cortexa9hf_neon noarch ${MACHINE}"

BBMULTICONFIG += "${MACHINE} ${SOC_B} qemux86-64"

# test
#MACHINE_FEATURES += "optee"
